name: Refresh supplier data

# Rebuilds supplier-data.js (catalog, subscription plans, deal calendar) from the store
# every morning and commits it if anything changed, so the published app stays current
# without anyone running the script by hand.

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC daily, after the store's midnight-Eastern deal rollover
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node refresh-supplier.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- supplier-data.js; then
            echo "no change"
          else
            git config user.name "supplier-refresh bot"
            git config user.email "actions@users.noreply.github.com"
            git add supplier-data.js
            git commit -m "Supplier data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
